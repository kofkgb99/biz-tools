<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 도구 모음</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#5f6b7a;--line:#dde2e8;--accent:#2f6fde}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1b1e23;--ink:#e7eaee;--muted:#9aa5b1;--line:#2d323a;--accent:#6b9cff}}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1e23;--ink:#e7eaee;--muted:#9aa5b1;--line:#2d323a;--accent:#6b9cff}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px}
a.tool{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;color:inherit;text-decoration:none;margin-top:12px}
a.tool:hover{border-color:var(--accent)}
a.tool b{color:var(--accent)}
p{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>업무 도구 모음</h1>
  <p>모든 도구는 브라우저 안에서만 계산해요. 데이터는 서버로 보내지 않아요.</p>
  <a class="tool" href="cost-check/"><b>📊 비용율 분석기</b><br>전년 실적과 계획을 비교해서 비용율이 오른 채널·제품을 찾아요.</a>
</div>
</body>
</html>
